aid: groyyo
name: Groyyo
description: 'Groyyo is a Gurugram, India based B2B manufacturing and supply-chain
  company for the fashion, apparel and lifestyle industry, founded in July 2021 by
  Subin Mitra and Pratik Tiwari. It connects global brands with a vetted network of
  small and mid-sized Asian factories and gives those factories production software
  — sales-order management, bill-of-materials creation, production tracking, quality
  control and business reporting — delivered as the Groyyo and Groyyo + mobile apps
  and an internal factory ERP rather than as a public developer platform. The company
  also runs sourcing, fabric and consulting lines, plus RFQ and supplier-KYC intake
  on its own website. As of August 2026 Groyyo publishes no developer portal, no API
  documentation and no machine-readable API contract on any host it controls.'
