  detail: >-
    Groyyo builds real software — the Groyyo + factory-management Android app and
    an internal factory ERP — but ships it only as apps to contracted brands and
    factories, with no developer program behind it: developer.groyyo.com,
    docs.groyyo.com and api.groyyo.com all 404, the site's own Next.js route
    manifest lists no /developers, /docs or /api route, and every /.well-known/
    and spec path (openapi.json, swagger.json, /graphql, agent-card.json) returns
    a true 404 verified against a bogus control path.
